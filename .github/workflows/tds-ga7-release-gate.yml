name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "TDS identity: 23f3003748@ds.study.iitm.ac.in"
        run: echo "23f3003748@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q